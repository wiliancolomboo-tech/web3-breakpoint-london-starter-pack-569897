# File: docker-compose.yml
version: "3.8"

services:
  breakpoint-daemon:
    build: .
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=BrkPntLndn1111111111111111111111111111111111
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SENDER_EMAIL=tickets@breakpoint-london.org
      - PORT=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3