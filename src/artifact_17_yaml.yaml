version: '3.8'

services:
  breakpoint-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: breakpoint_london_worker
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      - PROGRAM_ID=${PROGRAM_ID:-BrkP1ondon111111111111111111111111111111111}
      - RESEND_API_KEY=${RESEND_API_KEY:-mock}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-passes@solanabreakpoint.org}
      - SLACK_OR_DISCORD_WEBHOOK_URL=${SLACK_OR_DISCORD_WEBHOOK_URL}
      - OPS_NOTIFICATION_EMAIL=${OPS_NOTIFICATION_EMAIL:-admin@solanabreakpoint.org}
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"