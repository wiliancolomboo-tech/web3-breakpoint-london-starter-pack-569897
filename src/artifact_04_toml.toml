[package]
name = "london-starter-pack"
version = "0.1.0"
description = "Production-Ready Solana Breakpoint London Starter Pack and Entitlement Engine"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "london_starter_pack"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
solana-program = "=1.18.26"