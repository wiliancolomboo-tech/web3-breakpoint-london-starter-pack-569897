version: "3.8"

services:
  solana-validator:
    image: solanalabs/solana:v1.18.26
    container_name: breakpoint-test-validator
    ports:
      - "8899:8899"
      - "8900:8900"
    command: >
      solana-test-validator
      --reset
      --rpc-port 8899
      --bind-address 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -s -X POST -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getHealth\"}' http://localhost:8899 | grep -q 'ok'"]
      interval: 5s
      timeout: 5s
      retries: 10

  breakpoint-relayer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: breakpoint-relayer-service
    depends_on:
      solana-validator:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=http://solana-validator:8899
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - PAYMASTER_SECRET_KEY=${PAYMASTER_SECRET_KEY}
      - PROGRAM_ID=BrkptLon11111111111111111111111111111111111
    restart: unless-stopped