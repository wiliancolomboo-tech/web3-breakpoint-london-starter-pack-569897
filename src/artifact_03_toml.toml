[package]
name = "breakpoint-core"
version = "0.1.0"
description = "Solana Breakpoint London Enterprise Starter Pack Core Engine"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "breakpoint_core"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token"] }