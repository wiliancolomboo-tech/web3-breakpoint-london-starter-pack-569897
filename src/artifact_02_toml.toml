[package]
name = "breakpoint_starter_pack"
version = "0.1.0"
description = "Solana Breakpoint London Enterprise Starter Pack & Credential Engine"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "breakpoint_starter_pack"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }