version: '3.8'

services:
  telemetry-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_RPC_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=BrkPnt1111111111111111111111111111111111111
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_123456789
      - ALERT_EMAIL=admin@breakpoint-london.io
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect(80, 'api.devnet.solana.com')\""]
      interval: 30s
      timeout: 10s
      retries: 3